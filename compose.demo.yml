services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DEMO_MODE: 'true'
      MQTT_URL: ${MQTT_URL:?Execute bash scripts/demo.sh}
      MQTT_PREFIX: ${MQTT_PREFIX:?Execute bash scripts/demo.sh}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:?Execute bash scripts/demo.sh}
    ports:
      - '127.0.0.1:${DEMO_HTTP_PORT:-3000}:3000'
    volumes:
      - demo_sqlite:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  demo_sqlite:
    name: ${DEMO_DATA_VOLUME:-nightcare-demo_demo_sqlite}
