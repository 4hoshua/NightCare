# Combine with compose.demo.yml or compose.yml, using the same project name.
services:
  frontend-dev:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${DEV_HTTP_PORT:-5173}:5173'
    volumes:
      - ./frontend:/ui:ro
      - /ui/node_modules
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
